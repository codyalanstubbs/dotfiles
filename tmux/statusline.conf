# vim: ft=tmux
# Cyberdream statusline — clean, soft-vibrant pastel on near-black

set -g mode-style "fg=#16181a,bg=#5ef1ff"

set -g message-style "fg=#5ef1ff,bg=#1e2124"
set -g message-command-style "fg=#5ef1ff,bg=#1e2124"

set -g pane-border-style "fg=#3c4048"
set -g pane-active-border-style "fg=#5ef1ff"

set -g status on
set -g status-interval 5
set -g status-justify left

set -g status-style "fg=#7b8496,bg=#16181a"
set -g status-bg "#16181a"

set -g status-left-length 60
set -g status-right-length 60

# left: session name as a soft-pink badge
set -g status-left "#[fg=#16181a,bg=#f485dd,bold] #S #[fg=#f485dd,bg=#16181a] "

# right: hostname in cyan
set -g status-right "#[fg=#5ef1ff] #h "

setw -g window-status-activity-style "fg=#ffbd5e,bg=#16181a"
setw -g window-status-separator ""
setw -g window-status-style "fg=#7b8496,bg=#16181a"
setw -g window-status-format " #I·#W "
setw -g window-status-current-format "#[fg=#16181a,bg=#5ef1ff,bold] #I·#W #[default]"
