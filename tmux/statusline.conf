# vim: ft=tmux
# Monochrome (greyscale) statusline
set -g mode-style "fg=#0a0a0a,bg=#cfcfcf"

set -g message-style "fg=#e6e6e6,bg=#2a2a2a"
set -g message-command-style "fg=#e6e6e6,bg=#2a2a2a"

set -g pane-border-style "fg=#3a3a3a"
set -g pane-active-border-style "fg=#cfcfcf"

set -g status "on"
set -g status-interval 1
set -g status-justify "left"

set -g status-style "fg=#a0a0a0,bg=#1a1a1a"

set -g status-bg "#0a0a0a"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#0a0a0a,bg=#e6e6e6,bold] #S #[fg=#e6e6e6,bg=#7a7a7a,nobold,nounderscore,noitalics]#[fg=#0a0a0a,bg=#7a7a7a,bold] #(whoami) #[fg=#7a7a7a,bg=#0a0a0a]"
set -g status-right "#[fg=#3a3a3a,bg=#0a0a0a,nobold,nounderscore,noitalics]#[fg=#a0a0a0,bg=#3a3a3a]#[fg=#5a5a5a,bg=#3a3a3a,nobold,nounderscore,noitalics]#[fg=#cfcfcf,bg=#5a5a5a]#[fg=#cfcfcf,bg=#5a5a5a,nobold,nounderscore,noitalics]#[fg=#0a0a0a,bg=#cfcfcf,bold] #h "

setw -g window-status-activity-style "underscore,fg=#a0a0a0,bg=#0a0a0a"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#a0a0a0,bg=#0a0a0a"
setw -g window-status-format '#[fg=#0a0a0a,bg=#0a0a0a]#[default] #I  #W #[fg=#0a0a0a,bg=#0a0a0a,nobold,nounderscore,noitalics]'
setw -g window-status-current-format '#[fg=#0a0a0a,bg=#e6e6e6]#[fg=#1a1a1a,bg=#e6e6e6] #I #[fg=#e6e6e6,bg=#7a7a7a] #W #[fg=#7a7a7a,bg=#0a0a0a,nobold]'
